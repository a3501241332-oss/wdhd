<We are the world html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>世界大同 · One Planet Civilization</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:
"Inter",
"Microsoft YaHei",
sans-serif;
}


body{

background:#020409;
color:#fff;
overflow-x:hidden;

}


/* 星空 */

#stars{

position:fixed;
inset:0;
z-index:-2;

}



/* 导航 */

nav{

position:fixed;

top:0;
width:100%;

height:80px;

display:flex;

justify-content:space-between;

align-items:center;

padding:0 8%;

background:
rgba(0,0,0,.25);

backdrop-filter:
blur(20px);

z-index:100;


}


.logo{

font-size:26px;

letter-spacing:8px;

font-weight:300;

color:#fff;

}



.menu a{

margin-left:40px;

color:#aaa;

text-decoration:none;

font-size:14px;

letter-spacing:2px;

transition:.3s;

}


.menu a:hover{

color:#00eaff;

}



/* HERO */


.hero{

height:100vh;

position:relative;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

}



#earth{

position:absolute;

width:100%;

height:100%;

top:0;

left:0;

}



.hero-content{

position:relative;

z-index:3;

}


.hero h1{


font-size:

clamp(55px,8vw,110px);


font-weight:200;

letter-spacing:25px;


background:

linear-gradient(
90deg,
#fff,
#00eaff
);


-webkit-background-clip:text;

color:transparent;


}



.hero p{


margin-top:35px;

font-size:22px;

letter-spacing:8px;

color:#b8c9ff;


}



.enter{


display:inline-block;

margin-top:60px;


padding:

18px 55px;


border-radius:50px;


border:

1px solid #00eaff;


color:#00eaff;


text-decoration:none;


backdrop-filter:

blur(10px);


transition:.4s;


}


.enter:hover{


background:#00eaff;

color:#001;


box-shadow:

0 0 50px #00eaff;


}



/* 通用区域 */


section{

padding:

140px 10%;

}



.title{


text-align:center;

font-size:45px;

font-weight:200;

letter-spacing:12px;

margin-bottom:80px;


}





/* 数据卡 */


.cards{


display:grid;

grid-template-columns:

repeat(auto-fit,minmax(240px,1fr));

gap:35px;


}



.card{


background:

rgba(255,255,255,.05);


border:

1px solid rgba(255,255,255,.12);


border-radius:25px;


padding:40px;


backdrop-filter:

blur(20px);


transition:.5s;


}



.card:hover{


transform:

translateY(-15px);


border-color:#00eaff;


box-shadow:

0 20px 80px rgba(0,234,255,.2);


}



.number{


font-size:55px;

color:#00eaff;

font-weight:200;

}



.card h3{


margin:20px 0;

font-size:24px;

font-weight:300;


}



.card p{


color:#aaa;

line-height:2;


}




/* 世界网络 */


.network{


height:700px;


position:relative;


}



.node{


position:absolute;


width:15px;

height:15px;

background:#00eaff;

border-radius:50%;

box-shadow:

0 0 30px #00eaff;


animation:pulse 2s infinite;


}


@keyframes pulse{


50%{

transform:scale(2);

opacity:.5;

}

}



/* 未来城市 */


.future{


background:

linear-gradient(

180deg,

transparent,

rgba(0,100,255,.15)

);


text-align:center;

}



.future h2{


font-size:70px;

font-weight:200;


}



.future p{


max-width:900px;

margin:

40px auto;


font-size:22px;

line-height:2;

color:#aaa;


}



/* footer */


footer{


padding:50px;

text-align:center;

color:#555;

letter-spacing:3px;


}



.fade{


opacity:0;

transform:translateY(50px);

transition:

1s;


}


.fade.show{


opacity:1;

transform:none;


}





</style>

</head>


<body>


<canvas id="stars"></canvas>


<nav>


<div class="logo">

大同

</div>


<div class="menu">

<a href="#">文明</a>

<a href="#">未来</a>

<a href="#">星球</a>

<a href="#">宣言</a>

</div>


</nav>



<div class="hero">


<div id="earth"></div>



<div class="hero-content">


<h1>

世界大同

</h1>


<p>

ONE PLANET · ONE FUTURE

</p>



<a href="#future" class="enter">

ENTER FUTURE

</a>



</div>


</div>




<section class="fade">


<h2 class="title">

人类文明指数

</h2>



<div class="cards">


<div class="card">

<div class="number">

99%

</div>

<h3>

和平指数

</h3>

<p>

不同文明之间建立长期合作关系。

</p>


</div>



<div class="card">

<div class="number">

8.7B

</div>

<h3>

共同生命

</h3>

<p>

地球上的每个人都是文明共同体的一部分。

</p>

</div>




<div class="card">

<div class="number">

01

</div>

<h3>

共同星球

</h3>

<p>

从国家竞争走向文明协作。

</p>


</div>


</div>


</section>



<section class="network fade">


<h2 class="title">

全球文明网络

</h2>


<div class="node" style="top:40%;left:30%"></div>

<div class="node" style="top:30%;left:60%"></div>

<div class="node" style="top:60%;left:45%"></div>

<div class="node" style="top:50%;left:75%"></div>


</section>



<section id="future" class="future fade">


<h2>

2050

</h2>


<p>

未来的人类，
不再只是属于某个地区，
而属于同一个蓝色星球。

科技连接城市，
文化理解彼此，
文明共同走向宇宙。

</p>


</section>


<footer>

WORLD HARMONY © 2050

</footer>
<script>


/* ===========================
   THREE.JS 3D 地球
=========================== */


const container =
document.getElementById("earth");


const scene =
new THREE.Scene();



const camera =
new THREE.PerspectiveCamera(

45,

window.innerWidth/window.innerHeight,

0.1,

1000

);



camera.position.z = 3;



const renderer =
new THREE.WebGLRenderer({

alpha:true,

antialias:true

});


renderer.setSize(

window.innerWidth,

window.innerHeight

);


renderer.setPixelRatio(

window.devicePixelRatio

);



container.appendChild(renderer.domElement);





/*
地球材质
*/

const textureLoader =
new THREE.TextureLoader();



const earthTexture =
textureLoader.load(

"https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"

);



const earthGeometry =
new THREE.SphereGeometry(

1,

64,

64

);



const earthMaterial =
new THREE.MeshStandardMaterial({

map:earthTexture,

roughness:.8,

metalness:.1

});



const earth =
new THREE.Mesh(

earthGeometry,

earthMaterial

);



scene.add(earth);





/*
大气层
*/


const atmosphereGeometry =
new THREE.SphereGeometry(

1.03,

64,

64

);



const atmosphereMaterial =
new THREE.MeshBasicMaterial({

color:0x00aaff,

transparent:true,

opacity:.15,

side:THREE.BackSide

});


const atmosphere =
new THREE.Mesh(

atmosphereGeometry,

atmosphereMaterial

);



scene.add(atmosphere);






/*
灯光
*/


const light =
new THREE.DirectionalLight(

0xffffff,

2

);



light.position.set(

5,

3,

5

);


scene.add(light);



const ambient =
new THREE.AmbientLight(

0x335577,

1

);


scene.add(ambient);





/*
文明网络光点
*/


const points =
new THREE.Group();



for(let i=0;i<80;i++){


let geo =
new THREE.SphereGeometry(

0.008,

8,

8

);



let mat =
new THREE.MeshBasicMaterial({

color:0x00ffff

});



let p =
new THREE.Mesh(

geo,

mat

);



let phi =
Math.random()*Math.PI*2;


let theta =
Math.random()*Math.PI;



p.position.set(

Math.sin(theta)*Math.cos(phi)*1.04,

Math.sin(theta)*Math.sin(phi)*1.04,

Math.cos(theta)*1.04

);



points.add(p);


}



earth.add(points);






/*
星空背景
*/


const starCanvas =
document.getElementById("stars");


const ctx =
starCanvas.getContext("2d");



function resizeStar(){

starCanvas.width =
window.innerWidth;

starCanvas.height =
window.innerHeight;

}


resizeStar();



window.addEventListener(

"resize",

resizeStar

);



let stars=[];


for(let i=0;i<300;i++){


stars.push({

x:Math.random()*window.innerWidth,

y:Math.random()*window.innerHeight,

size:Math.random()*2,

speed:
Math.random()*0.5

});


}



function drawStars(){


ctx.clearRect(

0,

0,

starCanvas.width,

starCanvas.height

);



ctx.fillStyle="white";



stars.forEach(s=>{


ctx.globalAlpha =
Math.random();



ctx.beginPath();


ctx.arc(

s.x,

s.y,

s.size,

0,

Math.PI*2

);


ctx.fill();



s.y += s.speed;



if(
s.y>window.innerHeight
)

s.y=0;



});



requestAnimationFrame(drawStars);



}


drawStars();







/*
鼠标控制地球视角
*/


let mouseX=0;

let mouseY=0;



document.addEventListener(

"mousemove",

e=>{


mouseX =
(e.clientX/window.innerWidth-.5);


mouseY =
(e.clientY/window.innerHeight-.5);



});






/*
动画循环
*/


function animate(){


requestAnimationFrame(

animate

);



earth.rotation.y +=0.0018;


earth.rotation.x +=

(mouseY-earth.rotation.x)*0.02;



earth.rotation.y +=

(mouseX-earth.rotation.y)*0.002;



points.rotation.y +=0.002;



renderer.render(

scene,

camera

);


}



animate();







/*
窗口适配
*/


window.addEventListener(

"resize",

()=>{


camera.aspect =

window.innerWidth/window.innerHeight;



camera.updateProjectionMatrix();



renderer.setSize(

window.innerWidth,

window.innerHeight

);


}

);






/*
滚动渐入
*/


const observer =
new IntersectionObserver(

entries=>{


entries.forEach(

entry=>{


if(entry.isIntersecting){

entry.target.classList.add(
"show"
);


}


}

);


},

{

threshold:.2

}

);



document.querySelectorAll(
".fade"
)

.forEach(

el=>

observer.observe(el)

);



</script>
